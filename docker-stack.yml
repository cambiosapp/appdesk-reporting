version: '3.8'

services:
  appdesk:
    image: ghcr.io/cambiosapp/appdesk-reporting:${TAG:-latest}
    ports:
      - target: 3000
        published: 3000
        mode: host
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://devsupabase.cambios-app.com
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3MiOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0.qh_kwkB4VQuwZxhrrjhVYWuM06I9P5-N9EPOHUYbMc4
      - NEXT_PUBLIC_JIRA_URL=https://cambiosapp.atlassian.net
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogInNlcnZpY2Vfcm9sZSIsCiAgImlzcyI6ICJzdXBhYmFzZSIsCiAgImlhdCI6IDE3MTUwNTA4MDAsCiAgImV4cCI6IDE4NzI4MTcyMDAKfQ.pG42nkDNNDYyncEGmPJnqCplaBUsmkDcpRLUw76_Lj4
      - JIRA_URL=https://cambiosapp.atlassian.net
      - JIRA_EMAIL=asesortecnologico@jyr-asociados.com
      - JIRA_PAT=ATATT3xFfGF0obld06ou-YEKhkD8Ke0VR0Ca1Fk_gKlNPl2a4p3_Cr1Ck_glx1nN7lhrwbssz9p384LDDz_EO-fnRlgrr6waYuHWB4ifIso-sW5PX6VIwvpHZ4TIOhltO1ol-fHlQoJmS6W-uz2SdulYuvUyzgj2JhKgncoUOu3N14XmYwZBd9g=979C7075
      - JIRA_PROJECT_KEY=CA
    networks:
      - cambiosnet
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.appdesk.loadbalancer.server.port=3000"
        - "traefik.http.routers.appdesk.rule=Host(`appdesk.cambios-app.com`)"
        - "traefik.http.routers.appdesk.entrypoints=websecure"
        - "traefik.http.routers.appdesk.tls=true"
        - "traefik.http.routers.appdesk.tls.certresolver=letsencrypt"
        - "traefik.docker.network=cambiosnet"

networks:
  cambiosnet:
    external: true
    name: cambiosnet
