# ==========================================================
# AppDesk — Build & Push Docker Image to GitHub Container Registry
# ==========================================================
# Trigger: push a main o PR contra main
# Push: ghcr.io/cambiosapp/appdesk-reporting
# Tags: latest, <commit-sha>, <semver> (desde git tag)
# ==========================================================

name: Build & Push to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # Docker metadata (tags + labels)
      # ========================================
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ========================================
      # Login to GitHub Container Registry
      # ========================================
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # Setup Docker Buildx (multi-arch)
      # ========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================
      # Build & Push
      # ========================================
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time args para inline de NEXT_PUBLIC_* en el bundle cliente
          # Configúralas como secrets en GitHub:
          # https://github.com/cambiosapp/appdesk-reporting/settings/secrets/actions
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_JIRA_URL=${{ secrets.NEXT_PUBLIC_JIRA_URL }}
